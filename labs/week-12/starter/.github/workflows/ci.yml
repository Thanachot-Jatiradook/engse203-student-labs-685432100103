name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and run tests
        run: |
          npm install --prefix api
          npm install --prefix frontend
          npm test --prefix api
          npm test --prefix frontend
